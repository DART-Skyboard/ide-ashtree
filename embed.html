<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Samara OS</title>
<link rel="stylesheet" href="css/canopy.css?v=merge1">
<link rel="stylesheet" href="css/canopy-gestures.css?v=merge1">
  <link rel="stylesheet" href="css/canopy-web.css">
<link rel="stylesheet" href="css/canopy-rings.css?v=persist1">
<style>
  html,body{margin:0;height:100%;background:#05070a;color:#e9edf2;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #mount{position:fixed;inset:0}
  /* ?bare=1 (or #bare=1): the phone alone on a transparent page, for hosting inside a floating window on another site */
  html.bare,html.bare body{background:transparent;color-scheme:normal}
  .bare .cnp{padding:0;gap:0;background:transparent;overflow:visible;pointer-events:none}
  .bare .cnp-toolbar,.bare .cnp-hw,.bare .cnp-label{display:none}
  .bare .cnp-stage{padding:0;overflow:visible;pointer-events:none}
  .bare .cnp-fit{pointer-events:none}
  .bare .cnp-device{pointer-events:auto}
  .bare #mount{pointer-events:none}
  #msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:#8ab4cc}
  #msg b{color:#ff9500}
</style>
</head>
<body>
<div id="mount"></div>
<div id="msg"></div>
<script>try{if(/(?:^|[?&#])bare=1/.test(location.search+location.hash))document.documentElement.className+=' bare';}catch(e){}</script>
<script src="js/phone/samara-syntax.js?v=samara1"></script>
<script src="js/phone/seedpress.js?v=samara1"></script>
<script src="js/phone/samara-update.js?v=upd1"></script>
<script src="js/phone/wallpapers.js"></script>
<script src="js/phone/theme-art.js?v=merge1"></script>
<script src="js/phone/rings.js?v=merge1"></script>
<script src="js/phone/persist.js?v=merge1"></script>
<script src="js/phone/samara-os.js?v=merge1"></script>
<script src="js/phone/canopy-gestures.js?v=merge1"></script>
<script src="js/phone/canopy.js?v=merge1"></script>
<script src="js/phone/canopy-rings.js?v=merge1"></script>
<script>
(function () {
  var msg = document.getElementById("msg"), mount = document.getElementById("mount");
  function fail(t) { msg.style.display = "flex"; msg.innerHTML = "<div><b>Cannot start this seed.</b><br>" + t.replace(/</g, "&lt;") + "</div>"; }
  function b64urlToBytes(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
    var bin = atob(s), b = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
    return b;
  }
  async function fragToText(frag) {
    var b = b64urlToBytes(frag);
    if (b[0] === 0x1f && b[1] === 0x8b) {
      if (!window.DecompressionStream) throw new Error("This browser cannot decompress gzip links.");
      var ds = new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"));
      return new TextDecoder().decode(await new Response(ds).arrayBuffer());
    }
    return new TextDecoder().decode(b);
  }
  // Host bridge (bare mode): the embedding page can drive the phone and follow its size with postMessage.
  //   parent -> phone: {samara:"cmd", cmd:"power"|"rotate"|"shot"|"home"}      phone -> parent: {samara:"size", w, h, orientation} | {samara:"shot", url}
  function bridge(sim) {
    var dev = mount.querySelector(".cnp-device"), last = "";
    function post(m) { try { parent.postMessage(m, "*"); } catch (e) { /* no parent */ } }
    function size() {
      if (!dev) return; var W = parseFloat(dev.style.width) || 388, H = parseFloat(dev.style.height) || 808, k = W + "x" + H;
      if (k !== last) { last = k; post({ samara: "size", w: W, h: H, orientation: sim.orientation }); }
    }
    if (window.MutationObserver && dev) new MutationObserver(size).observe(dev, { attributes: true, attributeFilter: ["style", "class"] });
    size(); setTimeout(size, 300);
    window.addEventListener("message", function (ev) {
      var d = ev.data; if (!d || d.samara !== "cmd") return;
      if (d.cmd === "power") sim.press("power");
      else if (d.cmd === "rotate") sim.rotate();
      else if (d.cmd === "home") sim.press("home");
      else if (d.cmd === "shot") { Promise.resolve(sim.screenshot({ service: false })).then(function (u) { post({ samara: "shot", url: u || null }); }); }
      setTimeout(size, 60);
    });
  }
  async function main() {
    if (!window.Canopy || !Canopy.create) throw new Error("Canopy simulator is not available on this host.");
    var qs = new URLSearchParams(location.search), src = qs.get("src"), hash = location.hash.replace(/^#/, ""), text;
    var hm = /(?:^|&)seed=([^&]+)/.exec(hash);
    if (hm) text = await fragToText(hm[1]);
    else if (src) {
      var u = new URL(src, location.href);
      if (u.protocol !== "https:" && u.origin !== location.origin) throw new Error("Only https:// seed URLs are allowed.");
      var r = await fetch(u.href, { credentials: "omit" });
      if (!r.ok) throw new Error("Seed URL returned HTTP " + r.status + ". Private repo files cannot be fetched anonymously; publish a gist or use a #seed= link.");
      text = await r.text();
    } else throw new Error("Missing ?src=<seed URL> or #seed=<data>.");
    var seed = window.Seedpress && Seedpress.parse ? Seedpress.parse(text) : JSON.parse(text);
    if (seed && seed.seed && seed.magic === undefined) { if (seed.ok === false) throw new Error(seed.error || "Invalid seed file."); seed = seed.seed; }
    if (!seed || seed.magic !== "SAMARA-SEED") throw new Error("Not a SAMARA-SEED file.");
    if (window.Seedpress && Seedpress.verify) {
      var v = Seedpress.verify(seed);
      if (v === false || (v && v.ok === false)) throw new Error("Seed failed integrity verification.");
    }
    // updates: embeds are PINNED to exactly this seed by default. ?update=auto lets the embedded phone check a feed
    // (?feed=<https url>, else the seed's own sys.meta feed) and keep updates in this origin's localStorage.
    var autoUpd = qs.get("update") === "auto", feed = qs.get("feed") || "";
    if (feed) { var fu = new URL(feed, location.href); if (fu.protocol !== "https:" && fu.origin !== location.origin) throw new Error("Only https:// feed URLs are allowed."); feed = fu.href; }
    var sim = Canopy.create(mount, { seed: seed, onLog: function () {}, update: autoUpd, updateFeedUrl: feed || undefined });
    await sim.boot();
    if (document.documentElement.classList.contains("bare")) bridge(sim);
  }
  main().catch(function (e) { fail(e.message || String(e)); });
})();
</script>
</body>
</html>
